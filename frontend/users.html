<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Users Management</title>

    <link rel="stylesheet"
          href="css/admin.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div>

            <h2 class="logo">

                <i class="fa-solid fa-shield-halved"></i>

                Quiz Admin

            </h2>

            <ul>

                <li onclick="goDashboard()">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </li>

                <li class="active">

                    <i class="fa-solid fa-users"></i>

                    Users

                </li>

                <li onclick="goRequests()">

                    <i class="fa-solid fa-envelope"></i>

                    Quiz Requests

                </li>

                <li onclick="goAnalytics()">

                    <i class="fa-solid fa-chart-column"></i>

                    Analytics

                </li>

                <li onclick="logoutUser()">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </li>

            </ul>

        </div>

    </div>


    <!-- MAIN -->

    <div class="main-content">

        <div class="topbar">

            <div>

                <h1>
                    Users Management
                </h1>

                <p>
                    Monitor all registered users
                </p>

            </div>

        </div>


        <!-- TABLE -->

        <div class="section">

            <h2>
                Registered Users
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Username</th>

                        <th>Email</th>

                        <th>Role</th>

                    </tr>

                </thead>

                <tbody id="userTable">

                </tbody>

            </table>

        </div>

    </div>

    <script src="js/users.js"></script>

</body>

</html>
