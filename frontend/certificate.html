<!-- frontend/certificate.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Certificate
    </title>

    <link rel="stylesheet"
          href="css/certificate.css">

</head>

<body>

    <div class="certificate-container">

        <div class="certificate">

            <h1>

                Certificate of Achievement

            </h1>

            <p class="sub-title">

                This certificate is proudly presented to

            </p>

            <h2 id="studentName">

                Student Name

            </h2>

            <p>

                for successfully completing the quiz

            </p>

            <h3 id="quizName">
            </h3>

            <p id="score">
            </p>

            <p id="dateText">

            </p>

            <div class="signature-section">

                <div>

                    <div class="line">

                    </div>

                    <p>

                        QuizHub Platform

                    </p>

                </div>

                <div>

                    <div class="line">

                    </div>

                    <p>

                        Authorized Signature

                    </p>

                </div>

            </div>

            <button onclick="goDashboard()">

                Back to Dashboard

            </button>

        </div>

    </div>

    <script src="js/certificate.js"></script>

</body>

</html>
