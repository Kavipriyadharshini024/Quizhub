<!-- frontend/quiz.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Quiz
    </title>

    <link rel="stylesheet"
          href="css/quiz.css">

</head>

<body>

    <div class="quiz-container">

        <!-- TOP -->

        <div class="quiz-header">

            <h1 id="quizTitle">

                Quiz
            </h1>

            <div class="timer">

                ⏳ Time Left:
                <span id="timer">

                    10:00

                </span>

            </div>

        </div>


        <!-- PROGRESS -->

        <div class="progress-bar">

            <div class="progress">

            </div>

        </div>


        <!-- QUESTION -->

        <div class="question-box">

            <h2 id="questionNumber">

            </h2>

            <h1 id="questionText">

            </h1>

        </div>


        <!-- OPTIONS -->

        <div class="options"
             id="optionsContainer">

        </div>


        <!-- BUTTONS -->

        <div class="quiz-buttons">

            <button onclick="prevQuestion()">

                Previous

            </button>

            <button onclick="nextQuestion()">

                Next

            </button>

            <button onclick="submitQuiz()">

                Submit Quiz

            </button>

        </div>

    </div>

    <script src="js/quiz.js"></script>

</body>

</html>
