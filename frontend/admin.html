<!-- frontend/admin.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Dashboard
    </title>

    <link rel="stylesheet"
          href="css/admin.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div>

            <h2 class="logo">

                <i class="fa-solid fa-shield-halved"></i>

                Quiz Admin

            </h2>

            <ul>

                <li class="menu-item active"
                    onclick="showDashboard(this)">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </li>

                <li class="menu-item"
                    onclick="showUsers(this)">

                    <i class="fa-solid fa-users"></i>

                    Users

                </li>

                <li class="menu-item"
                    onclick="showQuizRequests(this)">

                    <i class="fa-solid fa-envelope"></i>

                    Quiz Requests

                </li>

                <li class="menu-item"
                    onclick="showAnalytics(this)">

                    <i class="fa-solid fa-chart-column"></i>

                    Analytics

                </li>

                <li class="menu-item"
                    onclick="showLogs(this)">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    Activity Logs

                </li>

                <li class="menu-item"
                    onclick="logoutUser()">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </li>

            </ul>

        </div>

    </div>



    <!-- MAIN CONTENT -->

    <div class="main-content">

        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h1 id="adminHeading">

                    Welcome 👋

                </h1>

                <p>

                    Manage your entire platform

                </p>

            </div>


            <div class="admin-profile">

                <div class="profile-circle">

                    A

                </div>

                <span id="adminName">

                    Admin

                </span>

            </div>

        </div>


        <!-- DYNAMIC CONTENT -->

        <div id="contentArea">

        </div>

    </div>

    <script src="js/admin.js"></script>

</body>

</html>
